---
name: sandbox
prefix: ""

mgmt:
  network: mgmt
  ipv4-subnet: 172.100.100.0/24

topology:

  defaults:
    kind: arista_ceos

  kinds:
    arista_ceos:
      image: arista/ceos:latest
      env:
        INTFTYPE: et
    linux:
      image: ghcr.io/aristanetworks/aclabs/host-ubuntu:rev1.7
  nodes:
    bld3-core-1:
      mgmt-ipv4: 172.100.100.2
      startup-config: clab/init-configs/bld3-core-1.cfg
      env:
        INTFTYPE: et
    bld3-core-2:
      mgmt-ipv4: 172.100.100.3
      startup-config: clab/init-configs/bld3-core-2.cfg
      env:
        INTFTYPE: et
    bld1-dist-1:
      mgmt-ipv4: 172.100.100.11
      startup-config: clab/init-configs/bld1-dist-1.cfg
      env:
        INTFTYPE: et
    bld1-dist-2:
      mgmt-ipv4: 172.100.100.12
      startup-config: clab/init-configs/bld1-dist-2.cfg
      env:
        INTFTYPE: et
    bld2-dist-1:
      mgmt-ipv4: 172.100.100.13
      startup-config: clab/init-configs/bld2-dist-1.cfg
      env:
        INTFTYPE: et
    bld2-dist-2:
      mgmt-ipv4: 172.100.100.14
      startup-config: clab/init-configs/bld2-dist-2.cfg
      env:
        INTFTYPE: et
    bld1-fl1-idf:
      mgmt-ipv4: 172.100.100.21
      startup-config: clab/init-configs/bld1-fl1-idf.cfg
      env:
        INTFTYPE: et
    bld1-fl2-idf:
      mgmt-ipv4: 172.100.100.22
      startup-config: clab/init-configs/bld1-fl2-idf.cfg
      env:
        INTFTYPE: et
    bld1-fl3-idf:
      mgmt-ipv4: 172.100.100.23
      startup-config: clab/init-configs/bld1-fl3-idf.cfg
      env:
        INTFTYPE: et
    bld2-fl1-idf:
      mgmt-ipv4: 172.100.100.24
      startup-config: clab/init-configs/bld2-fl1-idf.cfg
      env:
        INTFTYPE: et
    bld2-fl2-idf:
      mgmt-ipv4: 172.100.100.25
      startup-config: clab/init-configs/bld2-fl2-idf.cfg
      env:
        INTFTYPE: et
    bld2-fl3-idf:
      mgmt-ipv4: 172.100.100.26
      startup-config: clab/init-configs/bld2-fl3-idf.cfg
      env:
        INTFTYPE: et
    bld3-svc-1:
      mgmt-ipv4: 172.100.100.31
      startup-config: clab/init-configs/bld3-svc-1.cfg
      env:
        INTFTYPE: et
    bld3-svc-2:
      mgmt-ipv4: 172.100.100.32
      startup-config: clab/init-configs/bld3-svc-2.cfg
      env:
        INTFTYPE: et
    host1:
      kind: linux
      image: ghcr.io/aristanetworks/aclabs/host-ubuntu:rev1.6
      env:
        IPV4: 10.1.101.10/24
        GW: 10.1.101.1
        UPLINK_MAC: 00:01:01:00:00:01
    host2:
      kind: linux
      image: ghcr.io/aristanetworks/aclabs/host-ubuntu:rev1.6
      env:
        IPV4: 10.1.201.10/24
        GW: 10.1.201.1
        UPLINK_MAC: 00:01:01:00:00:02
    host4:
      kind: linux
      image: ghcr.io/aristanetworks/aclabs/host-ubuntu:rev1.6
      env:
        IPV4: 10.2.101.10/24
        GW: 10.2.101.1
        UPLINK_MAC: 00:01:01:00:00:04
    host5:
      kind: linux
      image: ghcr.io/aristanetworks/aclabs/host-ubuntu:rev1.6
      env:
        IPV4: 10.2.201.10/24
        GW: 10.2.201.1
        UPLINK_MAC: 00:01:01:00:00:05
    server-1:
      kind: linux
      image: ghcr.io/aristanetworks/aclabs/host-ubuntu:rev1.6
      env:
        IPV4: 10.3.100.10/24
        GW: 10.3.100.1
        UPLINK_MAC: 00:01:01:00:00:07
        TMODE: lacp
    guest1:
      kind: linux
      image: ghcr.io/aristanetworks/aclabs/host-ubuntu:rev1.6
      env:
        IPV4: 10.0.255.10/24
        GW: 10.0.255.1
        UPLINK_MAC: 00:01:01:00:00:03
    guest2:
      kind: linux
      image: ghcr.io/aristanetworks/aclabs/host-ubuntu:rev1.6
      env:
        IPV4: 10.0.255.11/24
        GW: 10.0.255.1
        UPLINK_MAC: 00:01:01:00:00:06
    dmz-server:
      kind: linux
      image: ghcr.io/aristanetworks/aclabs/host-ubuntu:rev1.6
      env:
        IPV4: 10.0.255.100/24
        GW: 10.0.255.1
        UPLINK_MAC: 00:01:01:00:00:08
        TMODE: lacp
  links:
    [
      { endpoints: [ "bld3-core-1:et1", "bld1-dist-1:et1" ] },
      { endpoints: [ "bld3-core-1:et2", "bld1-dist-2:et1" ] },
      { endpoints: [ "bld3-core-1:et3", "bld2-dist-1:et1" ] },
      { endpoints: [ "bld3-core-1:et4", "bld2-dist-2:et1" ] },
      { endpoints: [ "bld3-core-2:et1", "bld1-dist-1:et2" ] },
      { endpoints: [ "bld3-core-2:et2", "bld1-dist-2:et2" ] },
      { endpoints: [ "bld3-core-2:et3", "bld2-dist-1:et2" ] },
      { endpoints: [ "bld3-core-2:et4", "bld2-dist-2:et2" ] },
      { endpoints: [ "bld1-dist-1:et3", "bld1-fl1-idf:et1" ] },
      { endpoints: [ "bld1-dist-1:et4", "bld1-fl2-idf:et1" ] },
      { endpoints: [ "bld1-dist-1:et5", "bld1-fl3-idf:et1" ] },
      { endpoints: [ "bld1-dist-2:et3", "bld1-fl1-idf:et2" ] },
      { endpoints: [ "bld1-dist-2:et4", "bld1-fl2-idf:et2" ] },
      { endpoints: [ "bld1-dist-2:et5", "bld1-fl3-idf:et2" ] },
      { endpoints: [ "bld2-dist-1:et3", "bld2-fl1-idf:et1" ] },
      { endpoints: [ "bld2-dist-1:et4", "bld2-fl2-idf:et1" ] },
      { endpoints: [ "bld2-dist-1:et5", "bld2-fl3-idf:et1" ] },
      { endpoints: [ "bld2-dist-2:et3", "bld2-fl1-idf:et2" ] },
      { endpoints: [ "bld2-dist-2:et4", "bld2-fl2-idf:et2" ] },
      { endpoints: [ "bld2-dist-2:et5", "bld2-fl3-idf:et2" ] },
      { endpoints: [ "bld3-core-1:et5", "bld3-svc-1:et1" ] },
      { endpoints: [ "bld3-core-1:et6", "bld3-svc-2:et1" ] },
      { endpoints: [ "bld3-core-2:et5", "bld3-svc-1:et2" ] },
      { endpoints: [ "bld3-core-2:et6", "bld3-svc-2:et2" ] },
      { endpoints: [ "bld1-fl1-idf:et3", "host1:eth1" ] },
      { endpoints: [ "bld1-fl2-idf:et3", "host2:eth1" ] },
      { endpoints: [ "bld1-fl3-idf:et3", "guest1:eth1" ] },
      { endpoints: [ "bld2-fl1-idf:et3", "host4:eth1" ] },
      { endpoints: [ "bld2-fl2-idf:et3", "host5:eth1" ] },
      { endpoints: [ "bld2-fl3-idf:et3", "guest2:eth1" ] },
      { endpoints: [ "bld3-svc-1:et3", "server-1:eth1" ] },
      { endpoints: [ "bld3-svc-1:et4", "dmz-server:eth1" ] },
      { endpoints: [ "bld3-svc-2:et3", "server-1:eth2" ] },
      { endpoints: [ "bld3-svc-2:et4", "dmz-server:eth2" ] }
    ]
