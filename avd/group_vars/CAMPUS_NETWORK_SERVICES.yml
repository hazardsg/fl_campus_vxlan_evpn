---
### group_vars/CAMPUS_NETWORK_SERVICES.yml

tenants:
  - name: CAMPUS_TENANT
    mac_vrf_vni_base: 10000

    vrfs:
      # ── CAMPUS VRF ──────────────────────────────────────────────────────────
      # Corporate employee and shared services segments.
      # Department VLANs are stretched across ALL three floors of each building
      # so every IDF VTEP has remote peers in every VLAN (no empty flood lists).
      # Building-to-building routing is permitted within this VRF.
      - name: CAMPUS
        vrf_vni: 10
        vtep_diagnostic:
          loopback: 10
          loopback_ip_range: 10.255.10.0/27

        svis:
          - id: 1101
            name: MARKETING
            enabled: true
            ip_address_virtual: 10.1.101.1/24
            tags: [bld1]          # all three floors of Building 1

          - id: 1201
            name: ACCOUNTING
            enabled: true
            ip_address_virtual: 10.1.201.1/24
            tags: [bld1]          # all three floors of Building 1

          - id: 2101
            name: HR
            enabled: true
            ip_address_virtual: 10.2.101.1/24
            tags: [bld2]          # all three floors of Building 2

          - id: 2201
            name: ENGINEERING
            enabled: true
            ip_address_virtual: 10.2.201.1/24
            tags: [bld2]          # all three floors of Building 2

          - id: 310
            name: SHARED_SERVICES
            enabled: true
            ip_address_virtual: 10.3.100.1/24
            tags: [bld3-svc]

      # ── DMZ VRF ─────────────────────────────────────────────────────────────
      # Guest and DMZ segment. Isolated from CAMPUS VRF.
      # VLAN 255 is stretched across all IDFs (all buildings, all floors)
      # and the SVC switches, giving every VTEP remote flood-list peers.
      - name: DMZ
        vrf_vni: 20
        vtep_diagnostic:
          loopback: 20
          loopback_ip_range: 10.255.20.0/27

        svis:
          - id: 255
            name: GUEST_DMZ
            enabled: true
            ip_address_virtual: 10.0.255.1/24
            tags: [guest-dmz]     # all IDFs + SVC VTEPs
